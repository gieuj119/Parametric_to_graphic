<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>파라메트릭 → 그래픽 EQ 변환기</title>
<!-- Poweramp GZip 압축 해제용 라이브러리 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
 :root{--bg:#121214;--panel:#1c1c1f;--accent:#4fa3ff;--accent2:#ff9f43;--text:#eee;--muted:#9a9a9e;--border:#2c2c30;}
 @media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){--bg:#f2f2f5;--panel:#ffffff;--text:#111;--muted:#666;--border:#ddd;}
 }
 :root[data-theme="dark"]{--bg:#121214;--panel:#1c1c1f;--text:#eee;--muted:#9a9a9e;--border:#2c2c30;}
 *{box-sizing:border-box;}
 html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
 body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
  padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));
  padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));}
 .wrap{max-width:640px;margin:0 auto;}
 h1{font-size:1.15rem;margin:0 0 4px;}
 p.sub{color:var(--muted);font-size:.82rem;margin:0 0 16px;}
 .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;}
 label{display:block;font-size:.78rem;color:var(--muted);margin:10px 0 4px;}
 label:first-child{margin-top:0;}
 textarea{width:100%;min-height:110px;background:transparent;color:var(--text);
  border:1px solid var(--border);border-radius:8px;padding:8px;font-family:ui-monospace,monospace;font-size:.76rem;resize:vertical;}
 input[type=text],input[type=number]{width:100%;background:transparent;color:var(--text);
  border:1px solid var(--border);border-radius:8px;padding:9px;font-size:.88rem;}
 
 .file-box {
  border: 1px dashed var(--accent);
  background: rgba(79, 163, 255, 0.06);
  border-radius: 10px;
  padding: 16px 12px;
  text-align: center;
  cursor: pointer;
  margin-bottom: 12px;
  transition: background 0.2s;
  display: block;
 }
 .file-box:hover { background: rgba(79, 163, 255, 0.12); }
 .file-box span { font-size: 0.88rem; color: var(--accent); font-weight: 600; display: block; }
 .file-box small { font-size: 0.72rem; color: var(--muted); margin-top: 4px; display: block; }
 input[type=file] { display: none; }

 .row{display:flex;gap:10px;}
 .row>div{flex:1;min-width:0;}
 button.btn-convert{width:100%;margin-top:14px;padding:13px;border:none;border-radius:10px;
  background:var(--accent);color:#fff;font-size:.95rem;font-weight:600;cursor:pointer;}
 button.btn-convert:active{opacity:.8;}
 table{width:100%;border-collapse:collapse;margin-top:4px;font-size:.85rem;}
 td,th{padding:7px 3px;border-bottom:1px solid var(--border);text-align:center;}
 th{color:var(--muted);font-weight:500;font-size:.72rem;}
 canvas{width:100%;height:200px;display:block;margin-top:12px;}
 .legend{display:flex;gap:16px;font-size:.72rem;color:var(--muted);margin-top:6px;}
 .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;}
 #err{color:#ff6b6b;font-size:.82rem;margin-top:8px;min-height:1em;}
 #file-status{color:var(--accent);font-size:.82rem;margin-bottom:10px;font-weight:500;word-break:break-all;}
 #result{display:none;}
 .hint{font-size:.72rem;color:var(--muted);margin-top:8px;line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
 <h1>파라메트릭 → 그래픽 EQ 변환기</h1>
 <p class="sub">Poweramp 내보내기 파일 포함 모든 EQ 지원</p>

 <label for="fileInput" class="file-box">
  <span>📁 Poweramp 및 EQ 파일 선택 (.json / .txt)</span>
  <small>Poweramp 압축 JSON 파일 자동 해제 및 파싱 지원</small>
  <input type="file" id="fileInput" accept="*/*" onchange="loadFile(event)">
 </label>
 <div id="file-status"></div>

 <label>EQ 데이터 (내용 확인 및 수정 가능)</label>
 <textarea id="json"></textarea>

 <div class="row">
  <div><label>타겟 주파수(Hz)</label><input id="freqs" type="text" value="65,160,400,1000,2500,6000,14000"></div>
 </div>
 <div class="row">
  <div><label>그래픽 EQ의 Q</label><input id="q" type="number" value="1.1" step="0.1"></div>
  <div><label>샘플레이트</label><input id="fs" type="number" value="48000"></div>
 </div>
 <button class="btn-convert" onclick="convert()">변환하기</button>
 <div id="err"></div>
</div>

<div class="card" id="result">
 <table id="tbl"></table>
 <canvas id="chart"></canvas>
 <div class="legend">
  <span><span class="dot" style="background:#4fa3ff"></span>원본 곡선</span>
  <span><span class="dot" style="background:#ff9f43"></span>그래픽 EQ 근사</span>
 </div>
 <div class="hint">RBJ biquad 공식을 사용해 원본 곡선을 만들고, 경사하강법으로 지정 주파수의 게인을 최적화합니다.</div>
</div>
</div>

<script>
function peakResp(freqs, f0, Q, gainDb, fs){
 const A = Math.pow(10, gainDb/40);
 const w0 = 2*Math.PI*f0/fs;
 const alpha = Math.sin(w0)/(2*Q);
 let b0=1+alpha*A, b1=-2*Math.cos(w0), b2=1-alpha*A;
 let a0=1+alpha/A, a1=-2*Math.cos(w0), a2=1-alpha/A;
 b0/=a0;b1/=a0;b2/=a0;const a1n=a1/a0,a2n=a2/a0;
 return freqs.map(f=>{
  const w=2*Math.PI*f/fs;
  const cr=Math.cos(w), ci=-Math.sin(w);
  const c2r=Math.cos(2*w), c2i=-Math.sin(2*w);
  const numR=b0+b1*cr+b2*c2r, numI=b1*ci+b2*c2i;
  const denR=1+a1n*cr+a2n*c2r, denI=a1n*ci+a2n*c2i;
  const mag=Math.sqrt(numR*numR+numI*numI)/Math.sqrt(denR*denR+denI*denI);
  return 20*Math.log10(mag);
 });
}

function shelfResp(freqs, f0, Q, gainDb, fs, type){
 if(gainDb===0) return freqs.map(()=>0);
 const A=Math.pow(10,gainDb/40), w0=2*Math.PI*f0/fs, alpha=Math.sin(w0)/(2*Q), cosw0=Math.cos(w0), sqA=Math.sqrt(A);
 let b0,b1,b2,a0,a1,a2;
 if(type===0){
  b0=A*((A+1)-(A-1)*cosw0+2*sqA*alpha);
  b1=2*A*((A-1)-(A+1)*cosw0);
  b2=A*((A+1)-(A-1)*cosw0-2*sqA*alpha);
  a0=(A+1)+(A-1)*cosw0+2*sqA*alpha;
  a1=-2*((A-1)+(A+1)*cosw0);
  a2=(A+1)+(A-1)*cosw0-2*sqA*alpha;
 } else {
  b0=A*((A+1)+(A-1)*cosw0+2*sqA*alpha);
  b1=-2*A*((A-1)+(A+1)*cosw0);
  b2=A*((A+1)-(A-1)*cosw0-2*sqA*alpha);
  a0=(A+1)-(A-1)*cosw0+2*sqA*alpha;
  a1=2*((A-1)+(A+1)*cosw0);
  a2=(A+1)-(A-1)*cosw0-2*sqA*alpha;
 }
 b0/=a0;b1/=a0;b2/=a0;const a1n=a1/a0,a2n=a2/a0;
 return freqs.map(f=>{
  const w=2*Math.PI*f/fs;
  const cr=Math.cos(w), ci=-Math.sin(w);
  const c2r=Math.cos(2*w), c2i=-Math.sin(2*w);
  const numR=b0+b1*cr+b2*c2r, numI=b1*ci+b2*c2i;
  const denR=1+a1n*cr+a2n*c2r, denI=a1n*ci+a2n*c2i;
  const mag=Math.sqrt(numR*numR+numI*numI)/Math.sqrt(denR*denR+denI*denI);
  return 20*Math.log10(mag);
 });
}

function curveFor(bands, freqs, fs){
 const total=freqs.map(()=>0);
 bands.forEach(b=>{
  let r;
  if(b.type===3) r=peakResp(freqs,b.frequency,b.q,b.gain,fs);
  else r=shelfResp(freqs,b.frequency,b.q,b.gain,fs,b.type);
  r.forEach((v,i)=>total[i]+=v);
 });
 return total;
}

// Poweramp 및 일반 JSON 파서
function parseInput(text){
 text=(text||'').trim();
 if (!text) return null;

 try {
  const data = JSON.parse(text);
  let rawBands = null;

  // Poweramp JSON 구조 탐색
  if (data.presets && Array.isArray(data.presets)) {
   for (let p of data.presets) {
    if (p.bands || p.parametric || p.parametric_eq) {
     rawBands = p.bands || p.parametric || p.parametric_eq;
     break;
    }
   }
  }

  if (!rawBands && Array.isArray(data)) {
   rawBands = data;
  } else if (!rawBands && typeof data === 'object' && data !== null) {
   rawBands = data.bands || data.filters || data.eq || data.parametric || data.parametric_eq;
   if (!rawBands) {
    for (let key in data) {
     if (Array.isArray(data[key]) && data[key].length > 0) {
      rawBands = data[key];
      break;
     }
    }
   }
  }

  if (Array.isArray(rawBands) && rawBands.length) {
   const mappedBands = rawBands.map(b => {
    if (!b || typeof b !== 'object') return null;

    let type = 3; 
    const t = b.type ?? b.filterType ?? b.filter_type ?? b.shape ?? b.t ?? '';
    if (typeof t === 'string') {
     const tu = t.toUpperCase();
     if (tu.includes('LS') || tu.includes('LOW')) type = 0;
     else if (tu.includes('HS') || tu.includes('HIGH')) type = 1;
    } else if (typeof t === 'number') {
     type = t;
    }

    const freq = parseFloat(b.frequency ?? b.freq ?? b.f ?? b.fc ?? b.Hz ?? b.hz ?? 0);
    const gain = parseFloat(b.gain ?? b.g ?? b.dB ?? b.db ?? b.val ?? b.value ?? 0);
    const q = parseFloat(b.q ?? b.Q ?? b.bandwidth ?? b.bw ?? b.qFactor ?? 1.41);

    return { type, frequency: freq, gain, q };
   }).filter(b => b && !isNaN(b.frequency) && b.frequency > 0);

   if (mappedBands.length) return { mode: 'bands', bands: mappedBands };
  }
 } catch(e) {}

 // GraphicEQ 텍스트
 const geq = text.match(/GraphicEQ:\s*(.+)/i);
 if (geq) {
  const pts = geq[1].split(';').map(s=>s.trim()).filter(Boolean).map(s=>{
   const p = s.split(/\s+/); return {f:parseFloat(p[0]), g:parseFloat(p[1])};
  }).filter(p=>!isNaN(p.f)&&!isNaN(p.g));
  if (pts.length) return {mode:'curve', points:pts};
 }

 // Equalizer APO / 일반 txt
 const lines = text.split(/\r?\n/);
 const bands = [];
 lines.forEach(l => {
  const m1 = l.match(/(?:Filter\s*\d*:?\s*)?(?:ON\s+)?(PK|LSC|HSC|LS|HS|PEAK|LOW_SHELF|HIGH_SHELF)\s+Fc\s+([\d.]+)\s*Hz\s+Gain\s+(-?[\d.]+)\s*dB\s+Q\s+([\d.]+)/i);
  if (m1) {
   const k = m1[1].toUpperCase();
   const type = (k==='PK'||k==='PEAK') ? 3 : ((k==='LSC'||k==='LS'||k==='LOW_SHELF') ? 0 : 1);
   bands.push({ type, frequency: parseFloat(m1[2]), q: parseFloat(m1[4]), gain: parseFloat(m1[3]) });
  }
 });

 if (bands.length) return { mode: 'bands', bands };
 return null;
}

function curveForParsed(parsed, freqs, fs){
 if(parsed.mode==='bands') return curveFor(parsed.bands, freqs, fs);
 const pts=parsed.points.slice().sort((a,b)=>a.f-b.f);
 return freqs.map(f=>{
  const lf=Math.log10(f);
  if(lf<=Math.log10(pts[0].f)) return pts[0].g;
  if(lf>=Math.log10(pts[pts.length-1].f)) return pts[pts.length-1].g;
  for(let i=0;i<pts.length-1;i++){
   const l0=Math.log10(pts[i].f), l1=Math.log10(pts[i+1].f);
   if(lf>=l0 && lf<=l1){ const t=(lf-l0)/(l1-l0); return pts[i].g+t*(pts[i+1].g-pts[i].g); }
  }
  return 0;
 });
}

// 바이너리 / GZip 압축 해제 지원 파일 로더
function loadFile(ev){
 const f = ev.target.files[0]; 
 if (!f) return;
 
 const statusEl = document.getElementById('file-status');
 const reader = new FileReader();

 reader.onload = e => {
  let text = '';
  const buffer = e.target.result;

  // 1. Poweramp GZip 압축 해제 시도
  try {
   const decompressed = pako.ungzip(new Uint8Array(buffer), { to: 'string' });
   text = decompressed;
  } catch (gzipErr) {
   // 2. 압축 파일이 아닌 경우 일반 텍스트 변환 시도
   const decoder = new TextDecoder('utf-8');
   text = decoder.decode(buffer);
  }

  document.getElementById('json').value = text;
  
  const parsed = parseInput(text);
  if (parsed) {
   let info = (parsed.mode==='bands') ? `${parsed.bands.length}개 밴드 인식됨` : `${parsed.points.length}개 포인트 인식됨`;
   statusEl.style.color = 'var(--accent)';
   statusEl.textContent = `✔ [${f.name}] 로드 성공 (${info})`;
   convert();
  } else {
   statusEl.style.color = '#ff6b6b';
   statusEl.textContent = `✖ [${f.name}] 파일 데이터 파싱 실패.`;
  }
 };

 // ArrayBuffer로 바이너리 데이터 읽기
 reader.readAsArrayBuffer(f);
}

function convert(){
 const errEl=document.getElementById('err'); errEl.textContent='';
 const parsed=parseInput(document.getElementById('json').value);
 if(!parsed){ errEl.textContent='EQ 데이터를 해석할 수 없습니다.'; return; }
 const fs=parseFloat(document.getElementById('fs').value)||48000;
 const Q=parseFloat(document.getElementById('q').value)||1.1;
 const targetFreqs=document.getElementById('freqs').value.split(',').map(s=>parseFloat(s.trim())).filter(n=>!isNaN(n));
 if(!targetFreqs.length){ errEl.textContent='타겟 주파수를 입력해 주세요.'; return; }

 const N=200, grid=[];
 for(let i=0;i<N;i++) grid.push(20*Math.pow(1000,i/(N-1)));
 const target=curveForParsed(parsed,grid,fs);

 let gains=curveForParsed(parsed,targetFreqs,fs);

 function lossOf(gs){
  let tot=grid.map(()=>0);
  gs.forEach((g,i)=>{
   const r=peakResp(grid,targetFreqs[i],Q,g,fs);
   r.forEach((v,j)=>tot[j]+=v);
  });
  let s=0; tot.forEach((v,j)=>{const d=v-target[j]; s+=d*d;});
  return s/tot.length;
 }
 const lr=0.3, iters=150, delta=0.05;
 for(let it=0; it<iters; it++){
  const grads=gains.map((g,i)=>{
   const gp=gains.slice(), gm=gains.slice();
   gp[i]+=delta; gm[i]-=delta;
   return (lossOf(gp)-lossOf(gm))/(2*delta);
  });
  gains=gains.map((g,i)=>g-lr*grads[i]);
 }
 let fitted=grid.map(()=>0);
 gains.forEach((g,i)=>{
  const r=peakResp(grid,targetFreqs[i],Q,g,fs);
  r.forEach((v,j)=>fitted[j]+=v);
 });

 let html='<tr><th>주파수</th>'+targetFreqs.map(f=>`<th>${f>=1000?(f/1000)+'k':f}</th>`).join('')+'</tr>';
 html+='<tr><td>게인(dB)</td>'+gains.map(g=>`<td>${g>=0?'+':''}${g.toFixed(1)}</td>`).join('')+'</tr>';
 document.getElementById('tbl').innerHTML=html;
 document.getElementById('result').style.display='block';

 const cv=document.getElementById('chart');
 const dpr=window.devicePixelRatio||1;
 const cssW=cv.clientWidth||600, cssH=200;
 cv.width=cssW*dpr; cv.height=cssH*dpr;
 const ctx=cv.getContext('2d');
 ctx.scale(dpr,dpr);
 ctx.clearRect(0,0,cssW,cssH);
 const allVals=target.concat(fitted);
 let ymin=Math.min(-10,Math.min(...allVals)-1), ymax=Math.max(10,Math.max(...allVals)+1);
 function X(f){ return 34+(Math.log10(f)-Math.log10(20))/(Math.log10(20000)-Math.log10(20))*(cssW-44); }
 function Y(v){ return cssH-20-(v-ymin)/(ymax-ymin)*(cssH-30); }
 ctx.strokeStyle='rgba(150,150,150,.35)'; ctx.fillStyle='#9a9a9e'; ctx.font='10px sans-serif';
 ctx.beginPath(); ctx.moveTo(30,Y(0)); ctx.lineTo(cssW-10,Y(0)); ctx.stroke();
 [100,1000,10000].forEach(f=>{ ctx.fillText(f>=1000?(f/1000)+'k':f, X(f)-8, cssH-6); });
 function drawCurve(vals,color){
  ctx.strokeStyle=color; ctx.lineWidth=2; ctx.beginPath();
  grid.forEach((f,i)=>{ const x=X(f), y=Y(vals[i]); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.stroke();
 }
 drawCurve(target,'#4fa3ff');
 drawCurve(fitted,'#ff9f43');
}

// 기본 샘플 데이터
document.getElementById('json').value = JSON.stringify({
 "name":"샘플",
 "bands":[
  {"type":3,"frequency":150,"q":0.9,"gain":-1.2},
  {"type":3,"frequency":530,"q":1.0,"gain":1.7},
  {"type":3,"frequency":1800,"q":1.1,"gain":-3.8},
  {"type":3,"frequency":5800,"q":0.8,"gain":4.6}
 ]
}, null, 1);
</script>
</body>
</html>
